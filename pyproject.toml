[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sql-probe"
version = "0.1.0"
description = "Checks how an MCP server with a SQL query tool reports errors, enforces read-only mode and limits results."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["fastmcp>=4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcp-sql-probe = "mcp_sql_probe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
